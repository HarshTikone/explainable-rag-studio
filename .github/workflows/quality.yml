name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests and critical-module coverage
        run: >-
          pytest -q -m "not slow"
          --cov=backend.retriever
          --cov=backend.experiments
          --cov=backend.eval
          --cov=backend.grounding
          --cov=backend.grounding_eval
          --cov=backend.review_registry
          --cov=backend.security
          --cov=backend.database
          --cov-fail-under=90
      - name: Validate public release configuration and documentation
        run: |
          python scripts/validate_public_release.py
          python scripts/validate_docs.py
      - name: Build the zero-model public index
        env:
          LOW_MEMORY_DEMO: "true"
          SECURITY_MODE: demo
          PUBLIC_GEMINI_ENABLED: "false"
        run: python scripts/build_demo_index.py
      - name: Public API and UI smoke
        env:
          LOW_MEMORY_DEMO: "true"
          SECURITY_MODE: demo
          PUBLIC_GEMINI_ENABLED: "false"
          GEMINI_API_KEY: ""
        run: |
          python scripts/smoke_public_api.py
          python scripts/smoke_public_ui.py
