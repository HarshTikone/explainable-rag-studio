name: _diag label order (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q transformers huggingface_hub
      - run: |
          python -c "
          from transformers import AutoConfig
          for name, rev in [
              ('cross-encoder/nli-deberta-v3-xsmall', 'a150876415327c80daeff35ca6f68f5ed8cf5c24'),
              ('cross-encoder/nli-deberta-v3-small', 'fa2804872c3b4bd748f38c0185cc85775361e735'),
          ]:
              cfg = AutoConfig.from_pretrained(name, revision=rev)
              print(name, rev, '->', cfg.id2label, 'num_labels=', getattr(cfg, 'num_labels', None))
          "
