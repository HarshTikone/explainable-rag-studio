services:
  - type: web
    name: explainable-rag-studio-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      # Render exposes service environment variables to Docker builds as build
      # arguments. Dockerfile's matching ARG therefore prefetches the models
      # into the image instead of downloading them on the first live query.
      - key: PREFETCH_MODELS
        value: "true"
      # Legacy profile: local FAISS/SQLite, no Postgres/Redis/MinIO/Keycloak stack.
      # This is the public, sanitized, single-process demo profile -- not the
      # multi-tenant production platform in docker-compose.yml.
      - key: PLATFORM_MODE
        value: legacy
      # Anonymous visitors get the "viewer" role (query + documents:read only,
      # per backend/security_models.py's ROLE_SCOPES) -- no document upload,
      # no write access. Query volume is rate-limited (MemoryDemoRateLimiter,
      # 60 requests/minute shared across anonymous visitors by default).
      - key: SECURITY_MODE
        value: demo
      # Optional. Without it, claim generation falls back to the deterministic
      # extractive mode (docs/CLAIM_LEVEL_GROUNDING.md) -- the demo still works,
      # just without live Gemini generation. Set this in the Render dashboard
      # after the blueprint deploys; never commit a real key here.
      - key: GEMINI_API_KEY
        sync: false
