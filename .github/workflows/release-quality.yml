name: Release quality evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/prefetch_models.py') }}
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Dependency and static security checks
        run: |
          pip-audit -r requirements.txt
          bandit -q -ll -r backend api.py scripts -x tests
      - name: Complete Python 3.11 suite
        run: >-
          pytest -q -m "not slow"
          --cov=backend.retriever
          --cov=backend.experiments
          --cov=backend.eval
          --cov=backend.grounding
          --cov=backend.grounding_eval
          --cov=backend.review_registry
          --cov=backend.security
          --cov=backend.database
          --cov-fail-under=90
      - name: Real-model smoke tests
        env:
          RUN_RERANKER_SMOKE: "1"
          RUN_GROUNDING_SMOKE: "1"
        run: pytest -q -m slow tests/test_reranker_slow.py
      - name: Generate isolated reference secrets
        run: python scripts/generate_dev_secrets.py
      - name: Build and start portable platform
        run: |
          docker compose build
          docker compose up -d
          for attempt in {1..60}; do curl --fail http://localhost:8000/ready && break; sleep 5; done
          curl --fail http://localhost:8000/ready
          for attempt in {1..30}; do curl --fail http://localhost:8501/_stcore/health && break; sleep 2; done
          curl --fail http://localhost:8501/_stcore/health
      - name: FastAPI smoke
        env:
          API_KEY_PEPPER: release-ci-pepper-not-for-production
          AUDIT_HMAC_KEY: release-ci-audit-not-for-production
        run: |
          pytest -q tests/test_api_contract.py
          docker compose exec -T api sh -c '. deploy/env-secrets.sh && python scripts/bootstrap_security.py --organization "Release CI" --email owner@release.invalid' > bootstrap.json
          API_KEY=$(python -c "import json; print(json.load(open('bootstrap.json'))['api_key'])")
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/reviews
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/documents
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/audit/verify
      - name: Backup and restore evidence
        run: |
          docker compose exec -T postgres createdb -U rag_owner -O rag_app rag_restore
          BACKUP=$(docker compose exec -T api sh -c '. deploy/env-secrets.sh && python scripts/platform_backup.py')
          OBJECT_KEY=$(printf '%s' "$BACKUP" | python -c "import json,sys; print(json.load(sys.stdin)['object_key'])")
          RESTORE_URL="postgresql+psycopg://rag_app:$(cat .secrets/rag_app_password)@postgres:5432/rag_restore"
          docker compose exec -T api sh -c ". deploy/env-secrets.sh && python scripts/restore_validate.py \"$OBJECT_KEY\" --restore-url \"$RESTORE_URL\""
      - name: Retained quality experiment
        run: python scripts/run_release_validation.py --docker-passed --streamlit-passed --api-passed --dependencies-passed
      - name: Validate retained artifact
        run: python scripts/run_release_validation.py --validate "$(find outputs/releases -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
      - name: Retained security decision
        run: python scripts/run_security_validation.py --dependency-passed --static-passed --api-passed --streamlit-passed --docker-passed --platform-passed --backup-restore-passed
      - name: Require promoted decisions
        run: |
          python -c "import json; q=json.load(open('docs/benchmarks/quality-gate-reference.json')); assert q['quality_gate']['overall']['promoted'], q['quality_gate']"
          python -c "import json; q=json.load(open('outputs/security/security_gate.json')); assert q['decision']=='promoted', q['failure_reasons']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            outputs/releases/
            outputs/security/
            docs/benchmarks/quality-gate-reference.json
          if-no-files-found: error
          retention-days: 90
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop reference stack
        if: always()
        run: docker compose down -v
