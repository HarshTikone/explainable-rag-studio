name: Release quality evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/prefetch_models.py') }}
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Dependency and static security checks
        run: |
          pip-audit -r requirements.txt
          bandit -q -ll -r backend api.py scripts -x tests
      - name: Complete Python 3.11 suite
        run: >-
          pytest -q -m "not slow"
          --cov=backend.retriever
          --cov=backend.experiments
          --cov=backend.eval
          --cov=backend.grounding
          --cov=backend.grounding_eval
          --cov=backend.review_registry
          --cov=backend.security
          --cov=backend.database
          --cov-fail-under=90
      - name: Validate public release configuration and documentation
        run: |
          python scripts/validate_public_release.py
          python scripts/validate_docs.py
      - name: Public 512 MB image smoke
        run: |
          docker build --build-arg PREFETCH_MODELS=false --build-arg BUILD_DEMO_INDEX=true --build-arg LOW_MEMORY_DEMO=true -t explainable-rag-public:${{ github.sha }} .
          docker run --rm --memory=512m --memory-swap=512m -e LOW_MEMORY_DEMO=true -e SECURITY_MODE=demo -e PUBLIC_GEMINI_ENABLED=false -e GEMINI_API_KEY= -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 explainable-rag-public:${{ github.sha }} python scripts/smoke_public_demo.py
          docker run --rm --memory=512m --memory-swap=512m -e LOW_MEMORY_DEMO=true -e SECURITY_MODE=demo -e PUBLIC_GEMINI_ENABLED=false -e GEMINI_API_KEY= -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 explainable-rag-public:${{ github.sha }} python scripts/smoke_public_api.py
          docker run --rm --memory=512m --memory-swap=512m -e LOW_MEMORY_DEMO=true -e SECURITY_MODE=demo -e PUBLIC_GEMINI_ENABLED=false -e GEMINI_API_KEY= -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 explainable-rag-public:${{ github.sha }} python scripts/smoke_public_ui.py
      - name: Real-model smoke tests
        env:
          RUN_RERANKER_SMOKE: "1"
          RUN_GROUNDING_SMOKE: "1"
        run: pytest -q -m slow tests/test_reranker_slow.py
      - name: Generate isolated reference secrets
        run: python scripts/generate_dev_secrets.py
      - name: Build and start portable platform
        run: |
          docker compose build
          docker compose up -d
          for attempt in {1..60}; do curl --fail http://localhost:8000/ready && break; sleep 5; done
          curl --fail http://localhost:8000/ready
          for attempt in {1..30}; do curl --fail http://localhost:8501/_stcore/health && break; sleep 2; done
          curl --fail http://localhost:8501/_stcore/health
      - name: FastAPI smoke
        env:
          API_KEY_PEPPER: release-ci-pepper-not-for-production
          AUDIT_HMAC_KEY: release-ci-audit-not-for-production
        run: |
          pytest -q tests/test_api_contract.py
          docker compose exec -T api sh -c '. deploy/env-secrets.sh && python scripts/bootstrap_security.py --organization "Release CI" --email owner@release.invalid' > bootstrap.json
          API_KEY=$(python -c "import json; print(json.load(open('bootstrap.json'))['api_key'])")
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/reviews
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/documents
          curl --fail -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:8000/audit/verify
          echo "API_KEY=${API_KEY}" >> "$GITHUB_ENV"
      - name: Load test
        # Milestone 6's exit gate calls for load tests, and Milestone 7 wants a committed
        # load-test report as portfolio evidence -- neither existed before this. Mints 9
        # additional API keys under the org bootstrapped in "FastAPI smoke" (POST /api-keys,
        # not another bootstrap_security.py call -- bootstrap() is a one-time "first owner"
        # operation and already ran once above; calling it again raises "A first owner
        # already exists"). The platform's own per-identity rate limiter
        # (RATE_LIMIT_QUERY_PER_MINUTE, default 60/min) would otherwise dominate the
        # measurement well before 200 requests, and round-robining across 10 distinct keys
        # is a closer simulation of concurrent users than one client hammering a single key.
        run: |
          KEYS="${API_KEY}"
          for i in $(seq 1 9); do
            KEY=$(curl -sS --fail -X POST -H "Authorization: Bearer ${API_KEY}" -H "Content-Type: application/json" -d '{"scopes":["documents:read"]}' http://127.0.0.1:8000/api-keys | python -c "import json,sys; print(json.load(sys.stdin)['api_key'])")
            KEYS="${KEYS},${KEY}"
          done
          python scripts/load_test.py --api-keys "${KEYS}" --endpoint /documents --requests 200 --concurrency 10 --output outputs/load_test/report.json
      - name: Backup and restore evidence
        run: |
          docker compose exec -T postgres createdb -U rag_owner -O rag_app rag_restore
          BACKUP=$(docker compose exec -T api sh -c '. deploy/env-secrets.sh && python scripts/platform_backup.py')
          OBJECT_KEY=$(printf '%s' "$BACKUP" | python -c "import json,sys; print(json.load(sys.stdin)['object_key'])")
          RESTORE_URL="postgresql+psycopg://rag_owner:$(cat .secrets/postgres_password)@postgres:5432/rag_restore"
          docker compose exec -T api sh -c ". deploy/env-secrets.sh && python scripts/restore_validate.py \"$OBJECT_KEY\" --restore-url \"$RESTORE_URL\""
      - name: Retained quality experiment
        run: python scripts/run_release_validation.py --docker-passed --streamlit-passed --api-passed --dependencies-passed
      - name: Validate retained artifact
        run: python scripts/run_release_validation.py --validate "$(find outputs/releases -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
      - name: Retained security decision
        run: python scripts/run_security_validation.py --dependency-passed --static-passed --api-passed --streamlit-passed --docker-passed --platform-passed --backup-restore-passed
      - name: Require promoted decisions
        run: |
          python -c "import json; q=json.load(open('docs/benchmarks/quality-gate-reference.json')); assert q['quality_gate']['overall']['promoted'], q['quality_gate']"
          python -c "import json; q=json.load(open('outputs/security/security_gate.json')); assert q['decision']=='promoted', q['failure_reasons']"
      - name: Publish quality-gate reference to the run summary
        # docs/benchmarks/quality-gate-reference.json is regenerated fresh in every run
        # but the copy tracked in git only ever gets updated by a human/agent copying
        # numbers out of CI after the fact, so it goes stale between updates. Printing
        # it into the job summary (rendered directly on the Actions run page) means
        # anyone can grab the current numbers without downloading the artifact zip --
        # no repo write access needed, unlike committing it back automatically would be.
        if: always()
        run: |
          {
            echo '### Quality-gate reference (this run)'
            echo '```json'
            cat docs/benchmarks/quality-gate-reference.json 2>/dev/null || echo '(not generated -- an earlier step failed before this file was written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish load-test report to the run summary
        if: always()
        run: |
          {
            echo '### Load-test report (this run)'
            echo '```json'
            cat outputs/load_test/report.json 2>/dev/null || echo '(not generated -- the load-test step did not complete)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            outputs/releases/
            outputs/security/
            outputs/load_test/
            docs/benchmarks/quality-gate-reference.json
          if-no-files-found: error
          retention-days: 90
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop reference stack
        if: always()
        run: docker compose down -v
